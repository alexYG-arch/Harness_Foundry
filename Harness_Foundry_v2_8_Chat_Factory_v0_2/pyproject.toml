[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-foundry-chat-factory"
version = "0.2.0"
description = "Chat-native authoring factory for Harness Foundry v2.8 Start Package candidates."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hffactory = "harness_foundry_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
