[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-foundry-controlled-execution-runtime"
version = "0.1.7"
description = "Authorization-bound SQLite runtime for Harness Foundry v2.8 Workpacks."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hfdriver = "harness_foundry_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
