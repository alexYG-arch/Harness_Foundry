[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-foundry-chat-factory"
version = "0.2.0"
description = "Implementation-first local factory for Harness Foundry v2.9."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
security = ["cryptography>=45,<49"]
test = ["jsonschema>=4.18,<5"]

[project.scripts]
hffactory = "harness_foundry_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
