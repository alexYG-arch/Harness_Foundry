[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-foundry-chat-factory"
version = "0.2.0"
description = "Implementation-first local factory for Harness Foundry v2.9."
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/alexYG-arch/Harness_Foundry"
Issues = "https://github.com/alexYG-arch/Harness_Foundry/issues"

[project.optional-dependencies]
security = ["cryptography>=45,<49"]
test = ["jsonschema>=4.18,<5"]
runtime-audit = ["jsonschema>=4.18,<5", "referencing>=0.28,<1"]

[project.scripts]
hffactory = "harness_foundry_factory.entrypoint:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
