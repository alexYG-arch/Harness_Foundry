interface:
  display_name: "Harness Foundry Start Author"
  short_description: "验证 Foundry；先输出搭建文档，经人工确认后建设 Harness 或编写兼容 Start Package"
  default_prompt: "Use $harness-foundry-start-author with DEFAULT_ROUTE_FOUNDRY_CORE: validate the local Foundry using validate-core and package-local. For every Harness-building request, retain clarification Q&A, save and show a versioned build document, and wait for actual human confirmation before entering Foundry, even if internal checks pass. For an explicit generic Coding Harness build, then use EXPLICIT_ROUTE_GENERIC_BUILD and prepare the scope before recording real human runtime approval; advance bounded work without per-task gates. Use OPTIONAL_ROUTE_START_PACKAGE_COMPATIBILITY only for an explicit Start Package request after the same upstream human document review, preserving its authoring stop. Delegation and old approvals do not replace that review."
